name: PocketRack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift Package tests
        run: swift test --parallel
      - name: Build iOS App (unsigned)
        run: |
          if [ -d "PocketRackApp/PocketRack.xcodeproj" ]; then
            xcodebuild -project PocketRackApp/PocketRack.xcodeproj -scheme PocketRack -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
          fi
